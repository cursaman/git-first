<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 검색</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    padding:50px;
    font-family:Arial, sans-serif;
}

form{
    margin-bottom:30px;
}

input{
    width:300px;
    padding:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

.result_wrap{
    max-width:600px;
    border:1px solid #ddd;
    padding:20px;
    border-radius:10px;
}

.result{
    margin-bottom:20px;
}

.result_wrap p{
    margin-bottom:10px;
    font-size:18px;
}

.id{
    color:tomato;
    font-weight:bold;
}

.title{
    color:royalblue;
    font-weight:bold;
}

.description{
    color:#555;
}

</style>

</head>
<body>

<form>
    <input type="search" class="text" placeholder="영화 제목 입력">
    <button>검색</button>
</form>

<div class="result_wrap">
    <h2 class="result">검색결과</h2>

    <p>영화번호 : <span class="id"></span></p>
    <p>영화제목 : <span class="title"></span></p>
    <p>영화설명 : <span class="description"></span></p>
</div>

<script>

const movies = [
    {
        id:1,
        title:'어벤져스',
        description:'히어로들이 힘을 합쳐 지구를 지키는 액션 영화'
    },
    {
        id:2,
        title:'타이타닉',
        description:'타이타닉호에서 펼쳐지는 감동적인 사랑 이야기'
    },
    {
        id:3,
        title:'기생충',
        description:'봉준호 감독의 아카데미 수상작'
    },
    {
        id:4,
        title:'아바타',
        description:'판도라 행성을 배경으로 한 SF 영화'
    },
    {
        id:5,
        title:'겨울왕국',
        description:'엘사와 안나의 모험을 그린 애니메이션'
    }
];

const inputEl = document.querySelector('.text');
const buttonEl = document.querySelector('button');

const idEl = document.querySelector('.id');
const titleEl = document.querySelector('.title');
const descriptionEl = document.querySelector('.description');

buttonEl.addEventListener('click',(e)=>{

    e.preventDefault();

    const searchValue = inputEl.value;

    const resultMovie = movies.filter((movie)=>{
        return movie.title === searchValue;
    });

    if(resultMovie.length > 0){

        idEl.innerText = resultMovie[0].id;
        titleEl.innerText = resultMovie[0].title;
        descriptionEl.innerText = resultMovie[0].description;

    }else{

        idEl.innerText = '';
        titleEl.innerText = '검색결과가 없습니다.';
        descriptionEl.innerText = '';

    }

});

</script>

</body>
</html>
