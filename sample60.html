<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 검색</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 40px;
    }

    input {
        padding: 10px;
        width: 250px;
    }

    button {
        padding: 10px 16px;
        cursor: pointer;
    }

    .result_wrap {
        margin-top: 30px;
    }

    .result {
        color: #333;
    }

    .title {
        color: royalblue;
    }

    .description {
        font-size: 18px;
        color: #555;
    }
</style>
</head>
<body>

<form>
    <input type="search" class="text" placeholder="검색">
    <button>검색</button>
</form>

<div class="result_wrap">
    <h2 class="result">검색결과</h2>
    <h2 class="title"></h2>
    <h2 class="description"></h2>
</div>

<script>
    const inputEl = document.querySelector('.text');
    const buttonEl = document.querySelector('button');
    const titleEl = document.querySelector('.title');
    const descriptionEl = document.querySelector('.description');

    const movies = [
        {
            title: '어벤져스',
            description: '히어로들이 힘을 합쳐 지구를 지키는 액션 영화입니다.'
        },
        {
            title: '타이타닉',
            description: '타이타닉호에서 만난 두 남녀의 사랑 이야기를 그린 영화입니다.'
        },
        {
            title: '기생충',
            description: '두 가족의 만남을 통해 빈부격차를 보여주는 한국 영화입니다.'
        },
        {
            title: '아바타',
            description: '판도라 행성을 배경으로 펼쳐지는 SF 판타지 영화입니다.'
        },
        {
            title: '겨울왕국',
            description: '엘사와 안나 자매의 모험을 그린 애니메이션 영화입니다.'
        }
    ];

    buttonEl.addEventListener('click', (e) => {
        e.preventDefault();

        const searchValue = inputEl.value;

        const resultMovie = movies.find((movie) => {
            return movie.title === searchValue;
        });

        if (resultMovie) {
            titleEl.innerText = resultMovie.title;
            descriptionEl.innerText = resultMovie.description;
        } else {
            titleEl.innerText = '검색결과가 없습니다.';
            descriptionEl.innerText = '';
        }
    });
</script>

</body>
</html>
