<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        let num = 0;

        document.write("++num 의미는? 0 + 1 = 1을 의미한다. 값을 확인하면 : " + ++num + "<br>");    
        document.write("++num 의미는? 1 + 1 = 2을 의미한다. 값을 확인하면 : " + ++num + "<br>");    
        document.write("++num 의미는? 2 + 1 = 3을 의미한다. 값을 확인하면 : " + ++num + "<br>"); 
        document.write("지금의 num 값은? " + num + "<br>");
        document.write("num++ 의미는? 현재의 값은 3을 의미한다. 다음의 값이 4이며 값을 확인하면 : " + num++ + "<br>"); 
    
    
   

    </script>
</head>
