<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>좋아요 카드 6개</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
}

.wrap{
    max-width:900px;
    width:100%;
    margin:100px auto;

    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:30px;
}

.card{
    width:30%;
    text-align:center;
}

.box{
    width:100%;
    height:200px;
    background:#ddd;
    border-radius:20px;
}

.like_btn{
    margin-top:20px;
    font-size:40px;
    color:#bbb;
    cursor:pointer;
    transition:0.3s;
}

.like_btn.active{
    color:red;
    transform:scale(1.2);
}

</style>
</head>
<body>

<div class="wrap">

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

    <div class="card">
        <div class="box"></div>
        <i class="fa-solid fa-heart like_btn"></i>
    </div>

</div>

<script>

const likeBtns = document.querySelectorAll('.like_btn');

likeBtns.forEach(function(btn){

    btn.addEventListener('click', function(){

        btn.classList.toggle('active');

    });

});

</script>

</body>
</html>
