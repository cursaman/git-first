<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Swiper</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
    font-family:sans-serif;
}

.wrap{
    max-width:900px;
    width:100%;
    margin:80px auto;
    padding:20px;
}

.mySwiper{
    width:100%;
    height:500px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

.swiper-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* 페이지네이션 */

.swiper-pagination-bullet{
    background:#fff;
    opacity:0.6;
}

.swiper-pagination-bullet-active{
    background:#111;
    opacity:1;
}

/* 좌우 버튼 */

.prev-btn,
.next-btn{
    width:50px;
    height:50px;

    position:absolute;
    top:50%;
    transform:translateY(-50%);

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.4);
    color:#fff;

    border-radius:50%;
    cursor:pointer;
    z-index:100;
}

.prev-btn{
    left:20px;
}

.next-btn{
    right:20px;
}

.prev-btn i,
.next-btn i{
    font-size:18px;
}

/* 태블릿 */

@media screen and (max-width:768px){

    .wrap{
        padding:15px;
        margin:40px auto;
    }

    .mySwiper{
        height:320px;
        border-radius:16px;
    }

    .prev-btn,
    .next-btn{
        width:40px;
        height:40px;
    }

}

/* 모바일 */

@media screen and (max-width:480px){

    .wrap{
        padding:10px;
        margin:20px auto;
    }

    .mySwiper{
        height:260px;
        border-radius:12px;
    }

    /* 모바일은 스와이프 사용 */
    .prev-btn,
    .next-btn{
        display:none;
    }

}

</style>
</head>
<body>

<div class="wrap">

    <div class="swiper mySwiper">

        <div class="swiper-wrapper">
            <!-- JS 생성 -->
        </div>

        <div class="swiper-pagination"></div>

        <div class="prev-btn">
            <i class="fa-solid fa-chevron-left"></i>
        </div>

        <div class="next-btn">
            <i class="fa-solid fa-chevron-right"></i>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

<script>

// 이미지 배열

const images = [
    "https://picsum.photos/id/1015/1200/700",
    "https://picsum.photos/id/1025/1200/700",
    "https://picsum.photos/id/1035/1200/700",
    "https://picsum.photos/id/1043/1200/700",
    "https://picsum.photos/id/1050/1200/700"
];

const wrapper = document.querySelector(".swiper-wrapper");

// 슬라이드 자동 생성

images.forEach(function(img){

    wrapper.innerHTML += `
    
        <div class="swiper-slide">
            <img src="${img}" alt="">
        </div>

    `;

});

// Swiper 실행

new Swiper(".mySwiper",{

    loop:true,

    speed:800,

    autoplay:{
        delay:3000,
        disableOnInteraction:false
    },

    pagination:{
        el:".swiper-pagination",
        clickable:true
    },

    navigation:{
        nextEl:".next-btn",
        prevEl:".prev-btn"
    }

});

</script>

</body>
</html>
