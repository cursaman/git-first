<body>

<script>

    //createElement : 새로운 태그를 생성함

    //새로만들어진 p태그안에 내용을 넣고싶다.

    const pEl = document.createElement('p'); 
    const bodyEl = document.querySelector('body');

    //console.log(bodyEl);  생성되는 부분을 확인이 필요하다.
    //console.log(pEl);

    // 1. 첫번째 방법 - 우선순서?
    // bodyEl.appendChild(pEl);
    //body에 새로만들어진 pEl를 넣고싶다.
   
    // pEl.innerText = "새로 만들어진 p태그";    

    // 2. 두번째 방법 - 우선순서? 
    pEl.innerText = "새로 만들어진 p태그";   

    bodyEl.appendChild(pEl);
    //body에 새로만들어진 pEl를 넣고싶다.
    //appendChild 선택자의 자식으로 추가  






    

</script>
