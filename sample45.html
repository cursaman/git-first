<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타임 예제</title>
</head>
<body>

    <h1>타임 예제</h1>

    <script>
    
        const now = new Date();
        document.write(now);
        document.write("<br>");

        const date1 = new Date();
        document.write(date1.getFullYear() + "년");
        document.write("<br>");

        const date2 = new Date();
        document.write(date2.getMonth() + 1 + "월");
        document.write("<br>");

        const date3 = new Date();
        document.write(date3.getDate()+"일");
        document.write("<br>");

        const date4 = new Date();
        document.write(date4.getHours()+"시 "+date4.getMinutes()+"분 "+date4.getSeconds()+"초 ");


    </script>

</body>
</html>
