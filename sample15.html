<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
 
        const num_1 = 100;     // 조건문 : 조건에 따라 코드를 수행할지 판단해서 실행함 if(){} 
        const num_2 = 100;     // else : if 조건에 거짓일때  // 개발할때 사소한 부분까지 정의해야 한다. 
                               // 값이 같을때 오류가 난다.  
                               // else if : 거짓이고 그 다음 조건으로 사용되며  이조건이 또한 거짓이면 else 넘어감
                               // 여러개를 사용할수 있다
                               // 입력된 값이 문자인지 숫자인지 체크하는 문제 

        document.write(typeof(num_1) + "<br>");                       
        
        if (typeof(num_1) === "number" ){
            document.write("입력한 값은 숫자입니다."+ "<br>");  
        }else {
            document.write("입력한 값은 숫자가 아닙니다." + "<br>");  
        }




        if(num_1 > num_2){
              document.write("첫번째 입력한 값이 더 큽니다."+ "<br>");        

        } else if(num_1 === num_2){
              document.write("두 수가 같다."+ "<br>");   

        }else{
              document.write("두번째 입력한 값이 더 큽니다."+ "<br>");  
        } 




    </script>
</body>
</html>
