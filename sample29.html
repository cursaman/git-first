<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>DOM 예제</title>
</head>
<body>

  <script>
    // 리턴 : 함수 내부에서 특적값을 반환함
    // 값 변환뿐 아니라 코드를 종료할때도 사용함
    // 리턴 뒤에 코드를 작성하면 코드가 실행되지 암ㅎ음(종료선언)
    // 리턴하는 값이 줄바꿈되어야 될땐 () 소괄호를 이용하여 사용

    function add(a, b) {
    return a - b;
    }
    
    const result = add(50, 20);
    
    document.write(result);




  </script>

</body>
</html>
