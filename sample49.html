<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타임 예제</title>
</head>
<body>

    <h1>타임 예제</h1>

    <script>
    
        const now = new Date();
        document.write(now);
        document.write("<br>");

        const date1 = new Date();
        document.write(date1.getFullYear() + "년 "+ (date1.getMonth() + 1) + "월 " + date1.getDate()+"일 ");
        document.write("<br>");

        const date2 = new Date();
        document.write(date2.getHours()+"시 "+date2.getMinutes()+"분 "+date2.getSeconds()+"초 ");


    </script>

</body>
</html>
