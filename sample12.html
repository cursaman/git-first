<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
 
        const num_1 = 10;
        const num_2 = 5;
        const result = num_1 > num_2;

        console.log(num_1 > num_2  &&  num_1 < num_2 ); // 로그인 
        console.log(num_1 > num_2  ||  num_1 < num_2 ); // 중요한 정보가 아닐때

        console.log(!result);  // 참 아니면 거짓일때  버튼 스위칭, 햄버그 메뉴

    </script>
</head>
