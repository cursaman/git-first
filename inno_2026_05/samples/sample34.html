    .wrap{
        width: 500px;

        margin: 30px auto;
        border-radius: 20px;

    }

    .coverImg img{
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .avatar img{
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin: -50px 0 10px 30px;
        border: 5px solid white;
    }

    .id,
    .title,
    .username,
    .viewCount,

    }

    .title{

    }

    .detailUrl img{
        width: 100%;
        height: 200px;
