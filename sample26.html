<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>DOM 예제</title>
</head>
<body>

  <h1 id="title">자바스크립트 DOM 예제</h1>

  <p class="text">버튼을 누르면 글자가 변경됩니다.</p>

  <button onclick="changeText()">글자 변경</button>
  <button onclick="changeColor()">색상 변경</button>

  <script>
    function changeText() {
      document.getElementById("title").innerHTML = "DOM으로 글자 변경!";
      document.querySelector(".text").innerHTML = "자바스크립트로 HTML 내용을 바꿨습니다.";
    }

    function changeColor() {
      document.getElementById("title").style.color = "blue";
      document.querySelector(".text").style.color = "red";
    }
  </script>

</body>
</html>
