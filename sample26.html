<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

      // 배열(Array) : 여러값을 하나의 변수에 지정할때 사용  
      // 대괄호를 이용하영 값을 지정함 
      // 배열안에 지정된 값을 요소라고함
      // 요소의 순서는 index라고 하며 0부터 시작  
      // length는 길이 즉 요소의 개수를 의미함

    let user = {
    name : "Tom",
    age : 20
    }
    
    document.write(user.name + "<br>");
    document.write(user.age + "<br>");
           

    </script>
</head>
<body>
    
</body>
</html>
